[project]
name = "midibash"
version = "0.1.0"
description = "Read the MIDI and bash the solenoids"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adafruit-circuitpython-dht>=4.0.12",
    "mido>=1.3.3",
    "numpy>=2.4.1",
    "pillow>=12.1.0",
    "prometheus-client>=0.25.0",
    "pyserial>=3.5",
    "python-barcode[images]>=0.16.1",
    "python-escpos>=3.1",
    "python-rtmidi>=1.5.8",
]
[project.optional-dependencies]
raspberry-pi = [
    "adafruit-blinka>=8.68.1",
    "adafruit-circuitpython-mcp230xx>=2.5.19",
    "adafruit-circuitpython-typing>=1.12.3",
    "gpiozero>=2.0.1",
    "lgpio>=0.2.2.0",
    "pigpio>=1.78",
    "rpi-gpio>=0.7.1"
]
