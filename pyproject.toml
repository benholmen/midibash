[project]
name = "midi"
version = "0.1.0"
description = "Read the MIDI and hit the solenoids"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adafruit-blinka>=8.68.1",
    "adafruit-circuitpython-mcp230xx>=2.5.19",
    "adafruit-circuitpython-typing>=1.12.3",
    "gpiozero>=2.0.1",
    "lgpio>=0.2.2.0",
    "mido>=1.3.3",
    "pigpio>=1.78",
    "python-rtmidi>=1.5.8",
    "rpi-gpio>=0.7.1",
]
